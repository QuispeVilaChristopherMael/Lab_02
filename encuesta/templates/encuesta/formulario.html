<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .nav-links { margin-bottom: 20px; padding: 10px; background-color: #f0f4f8; border-radius: 5px; }
        .nav-links a { margin-right: 15px; color: #0066cc; text-decoration: none; font-weight: bold; }
        .nav-links a:hover { text-decoration: underline; }
        form { line-height: 1.8; }
        input[type="text"], input[type="password"], select { margin-bottom: 10px; padding: 4px; }
        input[type="submit"] { margin-top: 10px; padding: 6px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav-links">
        <strong>Navegación del Laboratorio:</strong>
        <a href="{% url 'encuesta:index' %}">1. Formulario Encuesta</a>
        <a href="{% url 'encuesta:operaciones' %}">2. Operaciones Matemáticas (Tarea 1)</a>
        <a href="{% url 'encuesta:cilindro' %}">3. Volumen Cilindro (Tarea 2)</a>
    </div>

    <h2>{{ titulo }}</h2>
    <form action="{% url 'encuesta:enviar' %}" method="post">
        {% csrf_token %}
        Nombre:
        <input type="text" name="nombre" maxlength="50"><br>
        Contraseña:
        <input type="password" name="password"><br>
        Educacion:
        <select name="educacion">
            <option value="sin-estudios">Sin estudios</option>
            <option value="educacion-obligatoria" selected="selected">Educación Obligatoria</option>
            <option value="formacion-profesional">Formación profesional</option>
            <option value="universidad">Universidad</option>
        </select> <br>
        Nacionalidad:
        <input type="radio" name="nacionalidad" value="hispana" checked>Hispana
        <input type="radio" name="nacionalidad" value="otra">Otra<br>
        Idiomas:
        <input type="checkbox" name="idiomas" value="español" checked="checked">Español
        <input type="checkbox" name="idiomas" value="inglés">Inglés
        <input type="checkbox" name="idiomas" value="francés">Francés
        <input type="checkbox" name="idiomas" value="aleman">Alemán<br>
        Email:
        <input type="text" name="email"><br>
        Sitio Web:
        <input type="text" name="sitioweb"><br>
        <!-- Botón de enviar -->
        <input type="submit" name="submit" value="Enviar">
    </form>
</body>
</html>
